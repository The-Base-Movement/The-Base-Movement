<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Security headers are managed server-side in vercel.json and vite.config.ts to avoid duplicate policies and meta-specification errors -->
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicon.png">
    <link rel="icon" type="image/x-icon" href="/branding/favicon.ico">
    <link rel="apple-touch-icon" href="/branding/logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="The Base">
    <meta name="msapplication-TileColor" content="#1a6b3c">
    <meta name="theme-color" content="#1a6b3c">
    <!-- Preload critical fonts for faster FCP and text render -->
    <link rel="preload" href="/fonts/PublicSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/PublicSans-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Preload LCP hero background image -->
    <link rel="preload" href="/branding/hero-background-image.webp" as="image" type="image/webp" fetchpriority="high">
    <!--app-head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
